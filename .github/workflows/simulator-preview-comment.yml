name: Comment Simulator Preview
on:
  workflow_run:
    workflows: [Build Simulator Preview]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
concurrency:
  group: simulator-preview-comments
  cancel-in-progress: false
jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      # Runs trusted default-branch code only. Never checks out or extracts PR artifacts.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_ORIGIN: ${{ vars.PREVIEW_ORIGIN }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (run.head_repository?.full_name !== repo || run.path !== '.github/workflows/simulator-preview-build.yml') return;
            const prs = run.pull_requests ?? [];
            if (prs.length !== 1) { core.warning('Expected one same-repository PR'); return; }
            const number = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.repo?.full_name !== repo || pr.head.sha !== run.head_sha) return;
            if (!process.env.PREVIEW_ORIGIN) { core.warning('Set the repository variable PREVIEW_ORIGIN to enable preview comments'); return; }
            const origin = new URL(process.env.PREVIEW_ORIGIN);
            if (origin.protocol !== 'https:' || origin.username || origin.password || origin.pathname !== '/' || origin.search || origin.hash) throw new Error('PREVIEW_ORIGIN must be an HTTPS origin');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id, per_page: 100 });
            const artifact = artifacts.find(a => a.name === 'simulator-preview' && !a.expired);
            if (!artifact) throw new Error('Simulator artifact not found');
            const url = `${origin.origin}/builds/${run.id}/${artifact.id}`;
            const marker = '<!-- simulator-preview -->';
            const body = `${marker}\n### Simulator Preview\n\n[▶ Open Preview](${url})\n\nCommit: \`${run.head_sha.slice(0, 7)}\` · Build: [${run.id}](${run.html_url})\n\nSign in to start your own simulator. This build expires on ${artifact.expires_at}.`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            // Re-check after API work so an older build does not replace a newer PR revision.
            const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (current.head.sha !== run.head_sha || current.state !== 'open') return;
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
